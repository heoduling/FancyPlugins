name: Maintenance fork bug
description: Report a reproducible FancyNpcs or FancyNpcsModel problem on Folia/Luminol
title: "[Fork bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove private addresses, tokens and player databases before submitting.
  - type: dropdown
    id: module
    attributes:
      label: Affected module
      options:
        - FancyNpcs
        - FancyNpcsModel
        - Integration between both
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server software and exact build
      placeholder: Luminol 1.21.11 build ...
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: Java 25.0.x
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Plugin versions
      description: Include FancyNpcs, FancyNpcsModel, BetterModel and SkinsRestorer.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: List commands and player movement in exact order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested after a full server restart, not a PlugMan hot reload.
          required: true
        - label: I removed secrets, private addresses and unrelated player data.
          required: true
