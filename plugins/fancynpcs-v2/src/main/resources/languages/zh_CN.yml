  # 通用命令用法（由 Cloud 提供）
  command_invalid_syntax_generic: "{errorColor}用法：{primaryColor}/{syntax}"

  # 命令用法
  command_syntax:
    fancynpcs: "用法：{primaryColor}/fancynpcs {secondaryColor}(version | reload | save | feature_flags)"
    npc: "{errorColor}未知命令。请使用 {primaryColor}/npc help{errorColor} 查看可用命令。"
    npc_action: "用法：{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}(add | add_after | add_before | clear | list | move_down | move_up | remove | set)"
    npc_action_add: "用法：{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}add {secondaryColor}(动作类型) [值]"
    npc_action_add_after: "用法：{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}add_after {secondaryColor}(序号) (类型) [值]"
    npc_action_add_before: "用法：{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}add_before {secondaryColor}(序号) (类型) [值]"
    npc_action_remove: "用法：{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}remove {secondaryColor}(序号)"
    npc_action_move_down: "用法：{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}move_down {secondaryColor}(序号)"
    npc_action_move_up: "用法：{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}move_up {secondaryColor}(序号)"
    npc_action_set: "用法：{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}set {secondaryColor}(序号) (类型) [值]"
    npc_attribute: "用法：{primaryColor}/npc attribute {secondaryColor}(NPC名称) {primaryColor}(set | list)"
    npc_attribute_set: "用法：{primaryColor}/npc attribute {secondaryColor}(NPC名称) {primaryColor}set {secondaryColor}(属性) (值)"
    npc_center: "用法：{primaryColor}/npc center {secondaryColor}(NPC名称)"
    npc_collidable: "用法：{primaryColor}/npc collidable {secondaryColor}(NPC名称) (开关状态)"
    npc_copy: "用法：{primaryColor}/npc copy {secondaryColor}(NPC名称) (新名称)"
    npc_create: "用法：{primaryColor}/npc create {secondaryColor}(NPC名称) [--type] [--location] [--world]"
    npc_displayname: "用法：{primaryColor}/npc displayname {secondaryColor}(NPC名称) (显示名称)"
    npc_equipment: "用法：{primaryColor}/npc equipment {secondaryColor}(NPC名称) {primaryColor}(set | clear | list)"
    npc_equipment_set: "用法：{primaryColor}/npc equipment {secondaryColor}(NPC名称) {primaryColor}set {secondaryColor}(装备槽) (@hand | @none | 物品)"
    npc_fix: "用法：{primaryColor}/npc fix {secondaryColor}(NPC名称)"
    npc_help: "用法：{primaryColor}/npc help {secondaryColor}[页码]"
    npc_glowing: "用法：{primaryColor}/npc glowing {secondaryColor}(NPC名称) (disabled | 颜色)"
    npc_info: "用法：{primaryColor}/npc info {secondaryColor}(NPC名称)"
    npc_interaction_cooldown: "用法：{primaryColor}/npc interaction_cooldown {secondaryColor}(NPC名称) (disabled | 时长)"
    npc_scale: "用法：{primaryColor}/npc scale {secondaryColor}(NPC名称) (缩放倍率)"
    npc_list: "用法：{primaryColor}/npc list {secondaryColor}[筛选条件…]"
    npc_move_here: "用法：{primaryColor}/npc move_here {secondaryColor}(NPC名称)"
    npc_move_to: "用法：{primaryColor}/npc move_to {secondaryColor}(NPC名称) (x) (y) (z) [世界]"
    npc_nearby: "用法：{primaryColor}/npc nearby {secondaryColor}[筛选条件…]"
    npc_remove: "用法：{primaryColor}/npc remove {secondaryColor}(NPC名称)"
    npc_rotate: "用法：{primaryColor}/npc rotate {secondaryColor}(NPC名称) (水平角度) (俯仰角度)"
    npc_show_in_tab: "用法：{primaryColor}/npc show_in_tab {secondaryColor}(NPC名称) (开关状态)"
    npc_skin: "用法：{primaryColor}/npc skin {secondaryColor}(NPC名称) (@none | @mirror | 正版用户名 | UUID | 占位符 | 链接 | 文件名) [--slim]"
    npc_teleport: "用法：{primaryColor}/npc teleport {secondaryColor}(NPC名称)"
    npc_turn_to_player: "用法：{primaryColor}/npc turn_to_player {secondaryColor}(NPC名称) (开关状态)"
    npc_turn_to_player_distance: "用法：{primaryColor}/npc turn_to_player_distance {secondaryColor}(NPC名称) (default | 距离)"
    npc_type: "用法：{primaryColor}/npc type {secondaryColor}(NPC名称) (类型)"
    npc_visibility: "用法：{primaryColor}/npc visibility {secondaryColor}(NPC名称) (all | permission_required | manual)"
    npc_visibility_distance: "用法：{primaryColor}/npc visibility_distance {secondaryColor}(NPC名称) (always_visible | default | not_visible | 距离)"

  # 命令（fancynpcs）
