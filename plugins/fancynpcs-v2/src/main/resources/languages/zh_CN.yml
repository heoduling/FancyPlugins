  fancynpcs_save_success: "{successColor}NPC 已保存。"
  fancynpcs_feature_flags_header: "<dark_gray><st>-------------------</st>   {secondaryColor}功能开关  <dark_gray><st>------------------</st><newline>"
  fancynpcs_feature_flags_entry: " <#848484>{number}. {primaryColor}{name} <#848484>({id})<dark_gray>: {state}"
  fancynpcs_feature_flags_footer: "<newline><dark_gray><st>-------------</st>  {secondaryColor}共显示 {primaryColor}{total_formatted}{secondaryColor} 项  <dark_gray><st>-------------</st>"
  fancynpcs_test_success: "{successColor}全部 {count} 项测试均已通过（由 {player} 于 {time} 运行）。"
  fancynpcs_test_failure: "{errorColor}部分测试未通过（由 {player} 于 {time} 运行）。"
  fancynpcs_skin_system_restart_schedulers_success: "{successColor}皮肤任务调度器已重启。"
  fancynpcs_skin_system_scheduler_status: "{successColor}状态（{scheduler}）：{status}"
  fancynpcs_skin_system_clear_queues_success: "{successColor}皮肤生成队列已清空。"
  fancynpcs_skin_system_clear_cache_success: "{successColor}皮肤缓存已清空。"
  fancynpcs_skin_system_clear_uuid_cache_success: "{successColor}UUID 缓存已清空。"

  # 命令（npc help）
  npc_help_page_header: "<dark_gray><st>-------------</st>  {primaryColor}FancyNpcs{secondaryColor} 命令（{primaryColor}{page}{secondaryColor}/{primaryColor}{max_page}{secondaryColor}）  <dark_gray><st>--------------</st><newline>"
  npc_help_page_footer: "<newline><dark_gray><st>-----------</st>  {secondaryColor}点击{primaryColor}<click:OPEN_URL:https://fancyinnovations.com/docs/minecraft-plugins/fancynpcs/commands/npc>这里</click>{secondaryColor}打开文档  <dark_gray><st>-----------</st>"
  npc_help_contents:
    - "<hover:show_text:'{secondaryColor}向列表添加一个新动作。'>{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}add {secondaryColor}(动作类型) [值]"
    - "<hover:show_text:'{secondaryColor}在列表的指定位置之后添加一个新动作。'>{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}add_after {secondaryColor}(序号) (动作类型) [值]"
    - "<hover:show_text:'{secondaryColor}在列表的指定位置之前添加一个新动作。'>{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}add_before {secondaryColor}(序号) (动作类型) [值]"
    - "<hover:show_text:'{secondaryColor}清空指定触发条件下的所有动作。'>{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}clear"
    - "<hover:show_text:'{secondaryColor}列出指定触发条件下的所有动作。'>{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}list"
    - "<hover:show_text:'{secondaryColor}将指定序号的动作下移一位。'>{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}move_down {secondaryColor}(序号)"
    - "<hover:show_text:'{secondaryColor}将指定序号的动作上移一位。'>{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}move_up {secondaryColor}(序号)"
    - "<hover:show_text:'{secondaryColor}从列表中移除指定动作。'>{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}remove {secondaryColor}(序号)"
    - "<hover:show_text:'{secondaryColor}在列表的指定位置添加一个新动作。'>{primaryColor}/npc action {secondaryColor}(NPC名称) (触发条件) {primaryColor}set {secondaryColor}(序号) (动作类型) [值]"
    - "<hover:show_text:'{secondaryColor}设置 NPC 的一项属性。'>{primaryColor}/npc attribute {secondaryColor}(NPC名称) {primaryColor}set {secondaryColor}(属性) (值)"
    - "<hover:show_text:'{secondaryColor}列出 NPC 所有已修改的属性。'>{primaryColor}/npc attribute {secondaryColor}(NPC名称) {primaryColor}list"
    - "<hover:show_text:'{secondaryColor}设置 NPC 是否会与其他实体发生碰撞。'>{primaryColor}/npc collidable {secondaryColor}(NPC名称) [开关状态]"
    - "<hover:show_text:'{secondaryColor}复制指定的 NPC。'>{primaryColor}/npc copy {secondaryColor}(NPC名称) (新名称)"
    - "<hover:show_text:'{secondaryColor}将 NPC 移到所在方块的中心。'>{primaryColor}/npc center {secondaryColor}(NPC名称)"
    - "<hover:show_text:'{secondaryColor}创建一个 NPC，可通过选项自定义。'>{primaryColor}/npc create {secondaryColor}(NPC名称) [--type] [--location] [--world]"
    - "<hover:show_text:'{secondaryColor}更改 NPC 的显示名称，支持 MiniMessage、PlaceholderAPI 和 MiniPlaceholders。'>{primaryColor}/npc displayname {secondaryColor}(NPC名称) (显示名称)"
    - "<hover:show_text:'{secondaryColor}将 NPC 的装备槽位设为你主手中的物品、指定类型的物品，或清空该槽位。'>{primaryColor}/npc equipment {secondaryColor}(NPC名称) {primaryColor}set {secondaryColor}(装备槽) (@hand | @none | 物品)"
    - "<hover:show_text:'{secondaryColor}清空 NPC 的所有装备槽位。'>{primaryColor}/npc equipment {secondaryColor}(NPC名称) {primaryColor}clear"
    - "<hover:show_text:'{secondaryColor}列出 NPC 的所有装备。'>{primaryColor}/npc equipment {secondaryColor}(NPC名称) {primaryColor}list"
    - "<hover:show_text:'{secondaryColor}设置 NPC 是否发光及其发光颜色。'>{primaryColor}/npc glowing {secondaryColor}(NPC名称) (disabled | 颜色)"
    - "<hover:show_text:'{secondaryColor}显示指定 NPC 的详细信息。'>{primaryColor}/npc info {secondaryColor}(NPC名称)"
    - "<hover:show_text:'{secondaryColor}设置 NPC 两次交互之间的冷却时间。'>{primaryColor}/npc interaction_cooldown {secondaryColor}(NPC名称) (disabled | 时长)"
    - "<hover:show_text:'{secondaryColor}列出所有世界中的 NPC，支持筛选和排序。'>{primaryColor}/npc list {secondaryColor}[--type] [--sort]"
    - "<hover:show_text:'{secondaryColor}将指定的 NPC 传送到你的位置。'>{primaryColor}/npc move_here {secondaryColor}(NPC名称)"
    - "<hover:show_text:'{secondaryColor}将 NPC 传送到指定位置。'>{primaryColor}/npc move_to {secondaryColor}(NPC名称) (x) (y) (z) [世界]"
    - "<hover:show_text:'{secondaryColor}列出你所在世界中的 NPC，支持筛选和排序。'>{primaryColor}/npc nearby {secondaryColor}[--radius] [--type] [--sort]"
    - "<hover:show_text:'{secondaryColor}删除指定的 NPC。'>{primaryColor}/npc remove {secondaryColor}(NPC名称)"
    - "<hover:show_text:'{secondaryColor}调整 NPC 的朝向（偏航角和俯仰角）。'>{primaryColor}/npc rotate {secondaryColor}(NPC名称) (水平角度) (俯仰角度)"
    - "<hover:show_text:'{secondaryColor}调整 NPC 的体型缩放倍率。'>{primaryColor}/npc scale {secondaryColor}(NPC名称) (缩放倍率)"
    - "<hover:show_text:'{secondaryColor}设置 NPC 是否显示在玩家列表中，仅适用于 PLAYER 类型的 NPC。<newline><newline>{errorColor}更改后可能需要重新连接服务器才会生效。'>{primaryColor}/npc show_in_tab {secondaryColor}(NPC名称) (开关状态)"
    - "<hover:show_text:'{secondaryColor}更改 NPC 的皮肤。<newline>{secondaryColor}支持 PlaceholderAPI 和 MiniPlaceholders。<newline><newline>{primaryColor}@none <dark_gray>- {secondaryColor}移除皮肤<newline>{primaryColor}@mirror <dark_gray>- {secondaryColor}显示查看者自己的皮肤<newline>{primaryColor}(名称) <dark_gray>- {secondaryColor}任意玩家的用户名<newline>{primaryColor}(链接) <dark_gray>- {secondaryColor}皮肤贴图的 URL'>{primaryColor}/npc skin {secondaryColor}(NPC名称) (@none | @mirror | 正版用户名 | 链接) [--slim]"
    - "<hover:show_text:'{secondaryColor}将你传送到指定的 NPC 身旁。'>{primaryColor}/npc teleport {secondaryColor}(NPC名称)"
    - "<hover:show_text:'{secondaryColor}设置 NPC 是否面向范围内的玩家。'>{primaryColor}/npc turn_to_player {secondaryColor}(NPC名称) (开关状态)"
    - "<hover:show_text:'{secondaryColor}设置 NPC 会在多远的范围内转向玩家。'>{primaryColor}/npc turn_to_player_distance {secondaryColor}(NPC名称) (距离)"
