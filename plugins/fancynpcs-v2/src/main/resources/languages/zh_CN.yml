  player_npcs_create_failure_limit_reached: "{errorColor}你创建的 NPC 数量已达上限。"
  player_npcs_create_failure_not_owned_plot: "{errorColor}你只能在自己的地块创建 NPC。"

  # 通用（以 OP 身份执行玩家命令的警告）
  player_command_as_op_warning: "{warningColor}<b>注意：</b>{secondaryColor}本服有 NPC 正在使用“player_command_as_op”动作。它会在执行命令时临时授予玩家 OP 权限，存在安全风险，不应继续使用。请尽快改用“player_command”，并确认玩家无需 OP 权限也能执行相应命令。“player_command_as_op”将在未来的更新中移除。"
  player_command_as_op_warning_affected: "{secondaryColor}受影响的 NPC：{warningColor}{affected_npcs}"

  # 命令（通用反馈）
  command_missing_permissions: "{errorColor}你没有权限使用此命令。"
  command_wrong_usage: "{errorColor}此子命令不存在。请使用 {primaryColor}/npc help{errorColor} 查看可用命令。"
  command_incomplete_usage: "{errorColor}命令不完整。请使用 {primaryColor}/npc help{errorColor} 查看正确用法。"
  command_player_only: "{errorColor}此命令只能由游戏内的玩家执行。"
